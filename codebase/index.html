<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Bản tin Điều hành — TA Co-pilot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>📋 Kênh điều hành <code>#ta-digest</code></h1>
      <p class="subtitle">Bản tin tổng hợp thắc mắc học viên cho TA/Mod — 22:00 mỗi ngày</p>
    </div>
    <div class="controls">
      <label for="day-select">Ngày:</label>
      <select id="day-select">
        <option value="2026-07-30">Hôm nay (30/07) — có 30 tin nhắn</option>
        <option value="2026-07-29">Hôm qua (29/07) — không có tin nhắn mới</option>
      </select>
      <button id="scan-btn">🔍 Quét dữ liệu hôm nay</button>
      <button id="resync-btn" class="secondary">🔄 Re-sync</button>
    </div>
  </header>

  <main id="digest-root" class="digest-root">
    <!-- render bởi app.js -->
  </main>

  <footer class="footer">
    <p>Prototype mức <strong>Mock</strong> (CP2) — data đầu vào là 30 tin nhắn giả lập (<code>mock-data.js</code>).
    Logic gom nhóm/lọc hiện là rule-based, sẽ thay bằng lời gọi AI thật ở CP3 (xem <code>codebase/README.md</code>).</p>
  </footer>

  <script src="mock-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
